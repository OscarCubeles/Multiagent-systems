resource_distribution_task:
  description: >
    A report of the allocation of ambulances. Use the Ambulance Resource Allocator tool to gather information. 
    The tool output will include the summary of the allocation of ambulances in fires.
  expected_output: >
    A report about  the information about fires and injured allocation, also explaining the parameters used in the Ambulance Resource Allocator tool,
    and how they impacted the allocation process .
  agent: medical_service_coordinator

ambulances_routing_task:
  description: >
    Use the Ambulances Route Calculator Tool to obtain the most efficient routes from hospitals to ambulances.
    The tool will help ensure ambulances can reach hospitals as quickly as possible, optimizing travel times and minimizing delays.
  expected_output: >
    A detailed report that describes the shortest route from each ambulance to a hospital, including the time it will take based on real-time road conditions.
    The report will also include the total number of ambulances, the hospitals they are assigned to, and the specific route taken.
  agent: ambulance_dispatcher

ambulance_causality_distribution:
  description: >
    Use the Ambulance Distribution Tool to generate a report with all causalities per each fire with the ambulances, routes and all the information of the fire such as the number of people healed on site.
  expected_output: >
    A detailed report explaining all fires and its parameters such as trips of ambulances, time to heal all people.
  agent: ambulance_causality_distributor










